name: QA Autonomo - Execucao

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID da execucao no QA Autonomo"
        required: true
      base_url:
        description: "Endereco do ambiente testado"
        required: true
      scripts:
        description: "Scripts aprovados (JSON em base64)"
        required: true

permissions:
  contents: read

run-name: "Execucao ${{ inputs.run_id }}"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preparar scripts
        env:
          SCRIPTS_B64: ${{ inputs.scripts }}
        run: |
          mkdir -p tests
          echo "$SCRIPTS_B64" | base64 -d > scripts.json
          node -e '
            const fs=require("fs");
            for (const s of JSON.parse(fs.readFileSync("scripts.json","utf8"))) {
              const name=s.file_name.replace(/[^a-zA-Z0-9._-]/g,"_");
              fs.writeFileSync("tests/"+name, s.code);
            }'
          cat > playwright.config.js <<CFG
          module.exports = {
            testDir: "./tests",
            reporter: [["list"], ["json", { outputFile: "results.json" }], ["html", { open: "never" }]],
            use: { baseURL: process.env.BASE_URL, screenshot: "only-on-failure", trace: "retain-on-failure" },
          };
          CFG
          npm init -y >/dev/null
          npm install @playwright/test@1 >/dev/null
          npx playwright install --with-deps chromium
      - name: Rodar testes
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: npx playwright test
      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-${{ inputs.run_id }}
          path: |
            results.json
            playwright-report/
            test-results/
  avisar:
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Avisar o QA Autonomo
        run: |
          curl -sS -X POST "https://qa-autonomo.lovable.app/api/public/github-run-finished" \
            -H "Content-Type: application/json" \
            -d '{"run_id":"${{ inputs.run_id }}","github_run_id":${{ github.run_id }}}' || true
